_base_: "configs/finetune_base.yaml"

model:
  name: "swin_unet"
  encoder: "swin_tiny_patch4_window7_224"
  pretrained: true
  in_channels: 3
  out_channels: 1

batch_size: 2
gradient_accumulation_steps: 8
gradient_checkpointing: true

output_dir: "outputs/swin_unet"
wandb_run_name: "swin_unet-tiny"
